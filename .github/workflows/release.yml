name: Foundry VTT Module Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1); defaults to v<module.json version>'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate JSON Files and JS Syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");

            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const requiredFields = ["id", "title", "version", "compatibility", "esmodules", "styles", "languages"];
            for (const field of requiredFields) {
              if (!manifest[field]) {
                throw new Error("Missing required field in module.json: " + field);
              }
            }
            if (!manifest.compatibility.minimum || !manifest.compatibility.verified) {
              throw new Error("module.json compatibility must define minimum and verified");
            }

            for (const lang of manifest.languages) {
              if (!fs.existsSync(lang.path)) {
                throw new Error("Missing language file: " + lang.path);
              }
              const langData = JSON.parse(fs.readFileSync(lang.path, "utf8"));
              if (!langData.KORUJA_HUD || typeof langData.KORUJA_HUD !== "object") {
                throw new Error(lang.path + " must contain top-level KORUJA_HUD object");
              }
              console.log("Validated", lang.path, "successfully");
            }
            console.log("Validated module.json successfully");
          '

          for file in scripts/*.js; do
            echo "Checking JS syntax: $file"
            node --input-type=module --check < "$file"
          done

      - name: Extract Tag & Clean Version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e '
            const fs = require("fs");
            let tag = "";
            if (process.env.EVENT_NAME === "workflow_dispatch") {
              tag = (process.env.INPUT_TAG || "").trim();
              if (!tag) {
                const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
                tag = `v${manifest.version}`;
              } else if (!tag.startsWith("v")) {
                tag = `v${tag}`;
              }
            } else {
              tag = process.env.REF_NAME;
            }
            const cleanVersion = tag.replace(/^v/, "");
            if (!/^[0-9A-Za-z._-]+$/.test(cleanVersion)) {
              throw new Error(`Invalid version derived from tag: ${tag}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `clean_version=${cleanVersion}\n`);
          '

      - name: Update module.json for Release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CLEAN_VERSION: ${{ steps.version.outputs.clean_version }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const tag = process.env.TAG;
            const cleanVersion = process.env.CLEAN_VERSION;
            const repo = process.env.REPO;

            manifest.version = cleanVersion;
            manifest.url = `https://github.com/${repo}`;
            manifest.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            manifest.download = `https://github.com/${repo}/releases/download/${tag}/module.zip`;

            fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Create module.zip Archive
        shell: bash
        run: |
          INCLUDE_PATHS=("module.json" "README.md" "LICENSE" "CHANGELOG.md" "scripts/" "styles/" "lang/")
          if [ -d "assets" ]; then
            INCLUDE_PATHS+=("assets/")
          fi
          zip -r ./module.zip "${INCLUDE_PATHS[@]}" -x "*.git*"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ./module.json
            ./module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
